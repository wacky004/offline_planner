name: offline_planner
description: A complete Flutter mobile planner application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.1
  table_calendar: ^3.0.9
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  flutter_local_notifications: ^17.0.0
  timezone: ^0.9.3
  uuid: ^4.3.3
  audioplayers: ^6.6.0
  file_picker: ^8.1.2
  connectivity_plus: ^7.1.0
  path_provider: ^2.1.5
  supabase_flutter: ^2.12.2
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  http: ^1.2.1
  pedometer: ^4.2.0
  permission_handler: ^12.0.1
  image_picker: ^1.2.1
  image_cropper: ^12.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
